# Abyssal Dominion Coins v2.0.3
# ecomobs.yml - Vanilla mob configuration
# ============================================

# ============================================
# Vanilla Mob Whitelist & Blacklist
# ============================================
#
# Use this file to control which vanilla mobs drop coins.
# Whitelist: Only listed mobs will drop coins
# Blacklist: Listed mobs will NOT drop coins
#
# Mob registry names use format: "minecraft:entity_name"

vanilla-mobs:
  whitelist:
    # Leave empty to allow all mobs by default
    # Add specific mobs here to restrict which mobs drop coins
  - "minecraft:zombie"
  - "minecraft:skeleton"
  - "minecraft:cow"
  - "minecraft:pig"
  - "minecraft:sheep"
  - "minecraft:chicken"
  - "minecraft:cat"
  - "minecraft:dolphin"
  - "minecraft:ocelot"
  - "minecraft:parrot"
  - "minecraft:fox"
  - "minecraft:ravager"
  - "minecraft:spider"
  - "minecraft:enderman"
  - "minecraft:pillager"
  - "minecraft:vindicator"
  - "minecraft:wither_skeleton"
  - "minecraft:husk"
  - "minecraft:stray"
  - "minecraft:witch"

  blacklist:
    # Leave empty to allow all listed mobs
  - ""

# ============================================
# Per-Mob Configuration
# ============================================
#
# Each mob has its own config section with:
#   - drop-chance: Probability of dropping coins (0.0 to 1.0)
#   - coin-amount: Range of coins to drop (min, max)
#   - multiplier: Rank multiplier range (min, max)
#
# Custom mobs from ecomobs are included below.

